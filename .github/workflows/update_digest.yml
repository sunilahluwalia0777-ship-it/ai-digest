name: Daily Digest Update

on:
  # Schedule disabled 2026-08-04: the Mac Mini local job (com.aiinfra.digest,
  # local Ollama llama3:70b) is now the primary runner, Mon-Sat 7am PDT.
  # Kept as workflow_dispatch only so this can still be run manually if needed.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
        run: python update_digest.py

      - name: Commit and push
        run: |
          git config user.name "AI Infra Bot"
          git config user.email "actions@github.com"
          git add index.html data/
          git diff --staged --quiet || git commit -m "Daily digest — $(date +'%Y-%m-%d')"
          git push
